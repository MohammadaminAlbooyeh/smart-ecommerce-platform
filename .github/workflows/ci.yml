name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  java-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared/java-common-lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-maven@v5
        with:
          distribution: maven-standard
      - run: mvn test

  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared/python-common-lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements-dev.txt -e .
      - run: pytest

  infra-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infrastructure/docker-compose/docker-compose.full.yml config > /dev/null

  script-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          files: scripts/*.sh

  e2e-syntax-check:
    # This repo has no application service code (see README) — the sibling
    # service repos that docker-compose.full.yml builds from aren't present
    # in CI, so the saga can't actually run here. This job only guards
    # against syntax regressions in the e2e script; run it for real locally
    # via `./scripts/test-e2e.sh` after `./scripts/setup-local-env.sh`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/test-e2e.sh
