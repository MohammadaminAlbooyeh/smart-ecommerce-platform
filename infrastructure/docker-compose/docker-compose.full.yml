version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  # ---- Application services (build context-ha point mikonan be sibling repo-haye local) ----

  user-service:
    build: ../../../user-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USERNAME: platform
      DB_PASSWORD: platform
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: change-me-change-me-change-me-change-me-change-me-1234567890
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - kafka

  cart-service:
    build: ../../../cart-service
    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    depends_on:
      - redis
      - kafka

  order-service:
    build: ../../../order-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: platform
      DB_PASSWORD: platform
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - kafka

  inventory-service:
    build: ../../../inventory-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: platform
      DB_PASSWORD: platform
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8084:8084"
    depends_on:
      - postgres
      - redis
      - kafka

  payment-switch-gateway:
    build: ../../../payment-switch-gateway
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: platform
      DB_PASSWORD: platform
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8085:8085"
    depends_on:
      - postgres
      - kafka

  product-search-engine:
    build: ../../../product-search-engine
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/search_db
      DB_USERNAME: platform
      DB_PASSWORD: platform
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8086:8086"
    depends_on:
      - postgres
      - elasticsearch
      - redis
      - kafka

  recommendation_engine:
    build:
      context: ../../../recommendation_engine
      dockerfile: Dockerfile.api
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8087:8000"
    depends_on:
      - kafka

  real_time_fraud_detection_system:
    build: ../../../real_time_fraud_detection_system
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
    ports:
      - "8088:8088"
    depends_on:
      - kafka
      - redis

  real_time_analytics_dashboard:
    build:
      context: ../../../real_time_analytics_dashboard
      dockerfile: Dockerfile.backend
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/analytics_db
    ports:
      - "8089:8000"
    depends_on:
      - postgres
      - kafka

volumes:
  postgres_data: