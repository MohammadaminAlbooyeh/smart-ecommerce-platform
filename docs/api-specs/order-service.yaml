openapi: 3.0.3
info:
  title: Order Service API
  version: 1.0.0
  description: Saga orchestrator for the order lifecycle (PENDING → AWAITING_PAYMENT → CONFIRMED/CANCELLED).
paths:
  /api/orders:
    post:
      summary: Create an order directly (publishes order.created)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    get:
      summary: List orders for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /api/orders/{orderId}:
    get:
      summary: Get order by id
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
  /api/orders/{orderId}/cancel:
    post:
      summary: Cancel an order (runs saga compensation)
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [userId, items]
      properties:
        userId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
    Order:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: string
        userId:
          type: string
        status:
          type: string
          enum: [PENDING, INVENTORY_RESERVED, AWAITING_PAYMENT, CONFIRMED, CANCELLED, FAILED]
        totalAmount:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string
          format: date-time
    OrderItem:
      type: object
      properties:
        productId:
          type: string
        name:
          type: string
        unitPrice:
          type: number
        quantity:
          type: integer
